name: Validate Game Design Suite

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate ChatGPT/Codex plugin and canonical skills
        run: python validate_skills.py

      - name: Validate Deep Code adapters
        run: python scripts/sync_agent_skills.py --check
